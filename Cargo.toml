[package]
name = "unicode-samples"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ivan Ukhov <ivan.ukhov@gmail.com>"]
description = "The package provides samples for Unicode languages and scripts."
documentation = "https://docs.rs/unicode-samples"
repository = "https://github.com/the-type-founders/unicode-samples-rs"
categories = ["text-processing"]
keywords = ["unicode"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
